# Qualifying source class = official statistical systems that publish
# (i) a monetary freight-transport *cost* magnitude already aligned to
# (ii) official tonne-km, at country × year × mode, without a proprietary
# model layer. None found.

closest_failed_candidate:
  id: nace_4941_opex_hire_or_reward
  formula: (SBS_purchases_49.41 + SBS_employee_benefits_49.41) / eurostat_road_tkm_hire_or_reward_registered
  status: failed
  why: >
    Strongest official pair: freight-labelled expenditure and a hire-or-reward
    tkm split. Still not frozen resource_unit_cost. Own-account is out of
    NACE 49.41. Capital user-cost is omitted. Road-only. Resident enterprises
    vs registered-vehicle tkm is a choice. Using it would be a new version
    ("unit cost of purchased road haulage"), not a rescue of FS-0001.

weaker_failed_candidate:
  id: sna_esa_transport_margins
  formula: naio_10_cp1620_transport_margins / official_tkm
  status: failed
  why: >
    SNA/ESA transport margins are a valuation residual: separately invoiced,
    seller-arranged freight in the basic→purchasers' price bridge. Not total
    resource cost of producing the tkm surveys measure. Published table mixes
    trade and transport. Five-yearly mandatory transmission.


refused_candidates:
  eurostat_sbs:
    reason: enterprise accounting ≠ territorial tkm; which SBS column is "cost" is Type B
  eurostat_sbs_pur_meur:
    reason: purchases of goods and services is intermediate expenditure, not frozen unit cost
  nace_4941_opex_hire_or_reward:
    reason: hire-or-reward road opex/tkm is a different observable (purchased haulage, not the capability)
  sna_esa_transport_margins:
    reason: valuation residual for separately invoiced seller-arranged freight; not total resource cost
  naio_10_cp1620:
    reason: joint trade+transport margin table; not a freight-cost series
  sut_intermediate_consumption_transport:
    reason: purchased services only; own-account missing; not mode-split

  eurostat_sppi:
    reason: price index is not currency/tkm
  oecd_itic_cif_fob:
    reason: trade margins + gravity; not official tkm
  unctad_worldbank_tt:
    reason: experimental, modelled distance, wrong denominator, short panel
  us_bts_revenue_per_ton_mile:
    reason: revenue not cost; single national market
  cnr_mitma_vehicle_cost:
    reason: not a multi-country official class; load factor is discretion
  cass_drewry_bdi:
    reason: shipper rates, not producer unit cost
  fuel_expenditure_over_tkm:
    reason: fuel is a stand-in, not frozen unit cost
  sbs_plus_us_bts_glue:
    reason: different objects glued to fake independence
  itf_infrastructure_spend:
    reason: capex/public O&M, passenger+freight network, not carrier operating unit cost
  eurostat_nama_10_a64:
    reason: NACE H production/GVA is mixed sector output, not freight unit cost
  eurostat_coicop_cp07:
    reason: household transport spending is mostly passenger
  eurostat_hicp_transport:
    reason: price index, not currency cost
  eurostat_cofog_transport:
    reason: government outlays, not carrier unit cost

