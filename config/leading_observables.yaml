    category: credit
    fred: BAMLH0A0HYM2
    short: hy_oas
    freq: daily
    lookback: 252
    role: veto
    status: wired
    veto_when: high_z
    z_threshold: 1.5
    clock_slot: credit_spreads
    note: ICE BofA HY OAS. High = credit stress. Already L2 extra-neutralize.

