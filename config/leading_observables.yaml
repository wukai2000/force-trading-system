# Non-price leading observables — T2 library, veto-only.
# Locked 2026-09-03. Cannot promote. Not a timing signal s_t.
# IR(s_t, r_t) with s from this catalog is refused.
# Does not scan Force 4. Does not unpause F1/F2/F3. Capital $0.
#
# Wired = FRED graph CSV, cache under data/macro/<short>.csv.
# Unwired = named for a future freeze; ClockBus returns None (no veto).
# Refused = no corpus / scrape / satellite in this mandate.

cannot_promote: true
capital: 0
force4: wait
role: veto_only
refuse_timing_overlay: true
note: >
  A Force is a pre-specified mechanism. These series are T2 candidates
  for a future freeze, and veto clocks once wired. They do not nowcast
  GDP/NFP, and they do not size a book.

