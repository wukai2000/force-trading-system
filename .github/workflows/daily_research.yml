name: Daily research

# Regression + locked-source refresh + pipeline reports.
# Cannot promote. Cannot scan Force 4. Does not invent a leftover.
# Does not overwrite data/meta/negative_control_audit.json (locked fixture).

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC ≈ 07:00 EDT
    - cron: "0 11 * * *"

concurrency:
  group: daily-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regress:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit + fixture tests
        run: |
          python scripts/test_neutralizer.py
          python scripts/test_freeze.py
          python scripts/test_null_engine.py
          python scripts/test_leading_observables.py
          python scripts/test_negative_control_contract.py
          python scripts/test_evidence_record.py
          python scripts/test_discovery_sieve.py
          python scripts/test_idea_registry.py
          python scripts/test_t5_contract.py
          python scripts/test_l4_wire.py
      - name: NO_RESULT paths
        run: |
          python scripts/run_evidence_record.py
          python scripts/run_idea_registry.py
          python scripts/assert_exit.py 2 python scripts/run_daily_research.py --promote
          python scripts/assert_exit.py 2 python scripts/run_daily_research.py --scan-force4

  refresh:
    needs: regress
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch locked sources + re-run diagnostic pipelines
        run: python scripts/run_daily_research.py
        continue-on-error: true
      - name: Fixture still F2-killed
        run: python scripts/test_negative_control_contract.py
      - name: Upload daily meta
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-meta
          path: |
            data/meta/daily_research.json
            data/meta/daily_negative_control.json
            data/meta/leading_observables.json
            data/meta/idea_registry_status.json
            data/meta/failfast_taxonomy_report.json
            data/meta/last_fetch.json
            data/meta/fs0001_lighting_contract.json
            data/meta/fs0001_t5_contract.json
            docs/FS-0001-T5-DATA-CONTRACT-REPORT.md
          if-no-files-found: ignore
      - name: Commit meta JSON if changed
        run: |
          git config user.name "force-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/meta/daily_research.json \
            data/meta/daily_negative_control.json \
            data/meta/leading_observables.json \
            data/meta/idea_registry_status.json \
            data/meta/failfast_taxonomy_report.json \
            data/meta/last_fetch.json \
            data/meta/fs0001_lighting_contract.json \
            data/meta/fs0001_t5_contract.json \
            docs/FS-0001-T5-DATA-CONTRACT-REPORT.md \
            || true
          if git diff --cached --quiet; then
            echo "No meta changes."
          else
            git commit -m "chore: daily research refresh [skip ci]

          Cannot promote. Force 4 not scanned. Locked negative-control fixture untouched."
            git push
          fi
