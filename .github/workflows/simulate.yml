name: Force System Simulate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [main]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force engine demo
        run: python -m force_engine.engine --demo

      - name: Trading engine demo (require_approval)
        run: python -m trading_engine.engine --policy require_approval --demo

      - name: Force learner summary
        run: python -m force_learning.learner
