name: Daily Force Learning

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run force-learning
        run: python -m force_learning.learner
      - name: Feed into force-engine
        run: |
          python -c "
from force_learning.learner import ForceLearner
learner = ForceLearner()
engine = learner.get_force_engine()
print('Forces:', [f.name for f in engine.list_forces()])
"
