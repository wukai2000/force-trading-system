name: Daily Trading Plan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m force_engine.engine --demo
      - run: python -m trading_engine.engine --policy require_approval --demo
