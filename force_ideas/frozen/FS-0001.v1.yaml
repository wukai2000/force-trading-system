original_observation: >
  Efficiency and unit-cost declines are expected to conserve a resource, yet
  aggregate use has risen after cost collapses when new applications appear.
why_this_exists: >
  Contradiction between conservation intuition and episodes of rising total use
  after unit cost fell.

hypothesis: >
  When the effective unit cost of a capability falls sharply, previously
  uneconomic applications become viable and aggregate demand for the
  underlying resource rises rather than falls.
mechanism: >
  If the price elasticity of demand for the final services a resource enables
  exceeds one in absolute value, a drop in unit cost unlocks new scalable uses.
  Efficiency improvements therefore lead expansion in total resource use
  instead of net conservation.
