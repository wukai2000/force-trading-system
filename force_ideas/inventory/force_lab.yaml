# Force Laboratory. Reconstruct known tug-of-wars. Returns enter last.
protocol_id: FORCE_PROTOCOL_v1.0
kind: force_laboratory
capital: 0
n_seeds: 0
tickers: []
ir_test: false
returns_define_force: false
selection_by_returns: false

experiments:
  E1_historical_reconstruction:
    status: PROTOCOL_OPEN
    returns_allowed: false
    tickers_allowed: false
    e1i_instance: SEALED_NO_RESULT
    fail_scope: E1I_LOCAL
  E2_blind_reconstruction:
    status: LOCKED
    unlock_if: E1_reconstructs_without_hindsight
  E3_competing_force:
    status: LOCKED
    unlock_if: E1_and_E2
  E4_market_efficiency_challenge:
    status: LOCKED
    unlock_if: fingerprint_exists
  E5_financial_transmission:
    status: LOCKED
    unlock_if: E1_to_E4
    note: mechanism_derives_names_IR_does_not

# Named so the protocol has objects. Placeholders parked. Crude is the first replay.
episodes:
  - id: EP-CRUDE-2014
    archetype: identity_lagged_supply_vs_demand
    window: "2014-07-02/2016-06-29"
    a: demand_destruction
    b: lagged_supply
    status: MECHANICAL_REPLAY
    returns_used: false
    identified: false
  - id: EP-NC-2011
    archetype: negative_control
    window: "2011-01-05/2012-06-27"
    a: demand_destruction
    b: lagged_supply
    status: NEGATIVE_CONTROL
    returns_used: false
    identified: false
  - id: EP-SEMI-2020
    archetype: A-SCARCITY-CAPACITY
    window: "2020-2023"
    a: demand_and_scarcity
    b: fab_capacity
    status: PARKED_SECOND_WAVE
    returns_used: false
    identified: false


e1_steps:
  - competing_forces
  - initial_state
  - footprints
  - ordering
  - delays_from_mechanism_not_returns
  - what_resisted
  - reversal
  - market_recognition_last

failure_modes:
  - no_coherent_fingerprint
  - fingerprint_after_financial_move
  - years_too_early
  - fingerprint_unstable_across_episodes
  - only_one_observable
  - hindsight_contamination
  - underidentified_many_forces
  - no_financial_transmission

refused:
  - reconstruct_with_returns
  - pick_best_episode_by_ir
  - fs0001_as_e1
  - nbi_as_episode
  - particle_filter_first
  - trade_execution
  - dpr_as_vintage

