      Memo-2's only novel move: drop CF, use independently surveyed stress.
      SAIDI starts 2013 (<15y). EIA-411 is a different object and ends ~2015.
      Weather/demand/policy are first-order. Not QUALIFIES until one reliability
      series and one geography are frozen without splice.

